[project]
name = "simplemeca-flask"
version = "1.2.0"
description = "Simple Focal Mechanism Generator based on PyGMT"
authors = [{ name = "Sean Ho", email = "sean.li.shin.ho@gmail.com" }]
requires-python = ">=3.12,<4"
readme = "README.md"
license = "MIT"
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
]
dependencies = [
    "fastapi[standard]>=0.129.0",
    "pygmt>=0.16.0,<0.17",
    "setuptools>=80.9.0,<81",
]

[tool.uv]

[tool.uv.build-backend]
module-name = ["simplemeca_flask"]
module-root = ""
namespace = true

[build-system]
requires = ["uv_build>=0.9.26,<0.10.0"]
build-backend = "uv_build"
